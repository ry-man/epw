<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2b2622">
  <meta name="mobile-web-app-capable" content="yes">
  <title>E.P.W. - Elemental Plumbing Wars</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header>
      <div id="turn">E.P.W.</div>
      <button id="zoomBtn" class="hbtn" aria-label="Zoom board">&#128269; Auto</button>
      <button id="menuBtn" class="hbtn" aria-label="Menu">&#9776;</button>
    </header>

    <section id="boardCol">
      <div id="boardWrap"><canvas id="board"></canvas></div>
      <div id="message" aria-live="polite"></div>
    </section>

    <section id="panel">
      <div id="scoreboard">
        <div class="score" id="score0" style="--team:#e0452a;--tint:#fdeee9">
          <div class="name"><span>Fire Folk <small id="who0"></small></span><b id="points0">0</b></div>
          <div class="deck"><div class="bar" id="bar0"></div></div>
        </div>
        <div class="score" id="score1" style="--team:#2f8fd8;--tint:#e8f3fc">
          <div class="name"><span>Ice Inhabitants <small id="who1"></small></span><b id="points1">0</b></div>
          <div class="deck"><div class="bar" id="bar1"></div></div>
        </div>
      </div>

      <div id="cycle">
        <div id="cycleRow"></div>
        <div id="countRow"></div>
      </div>
    </section>

    <section id="dock">
      <div id="handTitle"></div>
      <div id="hand"></div>
      <div id="controls">
        <button id="rotateBtn">&#10227; Rotate</button>
        <button id="discardBtn">Discard</button>
        <button id="endBtn">End turn</button>
      </div>
    </section>
  </main>

  <div id="title">
    <div id="titleStage"><canvas id="titleCanvas"></canvas></div>
    <div id="titleHint">&#8635; Turn your phone sideways for a bigger view</div>
    <div id="titleButtons">
      <button id="titleStart">Start Game</button>
      <button id="titleRules">How to Play</button>
    </div>
  </div>

  <div id="overlay" hidden>
    <div class="panel" id="setupPanel" hidden>
      <h1>E.P.W.</h1>
      <p class="sub">Elemental Plumbing Wars</p>
      <h3>Game length</h3>
      <div id="lengths" class="segs"></div>
      <h3>Fire Folk (FF)</h3>
      <select id="p0mode"></select>
      <h3>Ice Inhabitants (II)</h3>
      <select id="p1mode"></select>
      <h3>CPU speed</h3>
      <select id="speed">
        <option value="1">Normal</option>
        <option value="2">Fast</option>
        <option value="4">Very fast</option>
      </select>
      <div class="row">
        <button id="startBtn" class="primary">Start game</button>
        <button id="rulesBtn">How to play</button>
      </div>
    </div>

    <div class="panel" id="menuPanel" hidden>
      <h2>Menu</h2>
      <h3>CPU speed</h3>
      <select id="menuSpeed">
        <option value="1">Normal</option>
        <option value="2">Fast</option>
        <option value="4">Very fast</option>
      </select>
      <div class="col">
        <button id="menuRules">How to play</button>
        <button id="menuNew">New game</button>
        <button id="menuClose" class="primary">Resume</button>
      </div>
    </div>

    <div class="panel" id="rulesPanel" hidden>
      <h2 id="tutTitle">How to play</h2>
      <div id="tutStep"></div>
      <div id="tutDiagram"><canvas id="tutCanvas"></canvas></div>
      <div id="tutBody" class="rules"></div>
      <div class="row tutnav">
        <button id="tutPrev">&#9664; Back</button>
        <button id="tutNext">Next &#9654;</button>
      </div>
      <div id="tutDots"></div>
      <button id="rulesBack" class="primary" data-back="setupPanel">Close</button>
    </div>

    <div class="panel" id="overPanel" hidden>
      <div id="overBody"></div>
      <div class="row">
        <button id="overNew" class="primary">New game</button>
        <button id="overClose">View board</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/title.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
